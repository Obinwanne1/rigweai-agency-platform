<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RigweAI Agency{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/css/main.css">
  {% block head %}{% endblock %}
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">
        <div class="sidebar-logo-icon">R</div>
        <div class="sidebar-logo-text">RigweAI</div>
      </div>
      <div class="sidebar-logo-sub">Agency Platform</div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      {% block sidebar %}{% endblock %}
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-footer-user">
        <div class="sidebar-avatar" id="nav-user-avatar">—</div>
        <div class="sidebar-footer-info">
          <strong id="nav-user-name">—</strong>
          <span id="nav-user-role"></span>
        </div>
      </div>
      <div class="sidebar-footer-links">
        <button class="btn-logout" onclick="logout()">Sign Out</button>
        <a href="/profile" class="sidebar-settings-link" title="Settings">⚙</a>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <h1>{% block page_title %}Dashboard{% endblock %}</h1>
      <div class="flex-gap">
        {% block topbar_actions %}{% endblock %}
        <button class="btn-dark-toggle" id="dark-toggle" title="Toggle dark mode" onclick="toggleDark()">🌙</button>
      </div>
    </div>
    <div class="page-body">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

<script src="/static/js/dark-mode.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/nav-user.js"></script>
<script src="/static/js/auth.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
