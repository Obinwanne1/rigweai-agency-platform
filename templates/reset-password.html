<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — RigweAI Agency</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <h1>RigweAI Agency</h1>
      <p>Set a new password</p>
    </div>

    <div id="rp-error" class="login-error"></div>

    <div id="rp-form-wrap">
      <form id="rp-form">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <div class="password-wrap">
            <input class="form-input" type="password" id="rp-new" required autocomplete="new-password" placeholder="Min 8 chars, upper, lower, number, symbol">
            <button type="button" class="btn-eye" onclick="toggleEye('rp-new','eye-rp-new')" id="eye-rp-new" title="Show/hide">👁</button>
          </div>
          <div class="pw-strength" id="rp-strength"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <div class="password-wrap">
            <input class="form-input" type="password" id="rp-conf" required autocomplete="new-password" placeholder="Repeat new password">
            <button type="button" class="btn-eye" onclick="toggleEye('rp-conf','eye-rp-conf')" id="eye-rp-conf" title="Show/hide">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px 16px;">
          <span id="rp-spinner" class="spinner hidden"></span>
          <span id="rp-btn-text">Set New Password</span>
        </button>
      </form>
    </div>

    <div id="rp-success" class="hidden" style="background:#dcf0e5; border:1px solid #a8d5b5; border-radius:8px; padding:16px; font-size:0.88rem; line-height:1.6; color:#1a5c35;">
      ✓ <strong>Password reset successfully.</strong><br>
      Redirecting to login…
    </div>

    <div id="rp-invalid" class="hidden" style="background:#fde8e8; border:1px solid #f5c6c6; border-radius:8px; padding:16px; font-size:0.88rem; line-height:1.6; color:#7a1a1a;">
      ✗ <strong>Invalid or expired reset link.</strong><br>
      <a href="/forgot-password" style="color:#c0392b; font-weight:600;">Request a new reset link →</a>
    </div>

    <div style="text-align:center; margin-top:20px;">
      <a href="/login" style="font-size:0.85rem; color:#448440; text-decoration:none;">← Back to Sign In</a>
    </div>
  </div>
</div>
<script src="/static/js/ui-utils.js"></script>
<script src="/static/js/reset-password.js"></script>
</body>
</html>
