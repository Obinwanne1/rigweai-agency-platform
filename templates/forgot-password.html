<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — RigweAI Agency</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <h1>RigweAI Agency</h1>
      <p>Reset your password</p>
    </div>

    <div style="background:#f0f4e8; border:1px solid #d4d9c0; border-radius:8px; padding:16px; margin-bottom:20px; font-size:0.88rem; line-height:1.6; color:#444;">
      <strong style="color:#448440;">No email system is configured yet.</strong><br><br>
      To reset your password, contact your admin:<br>
      <a href="mailto:admin@rigweai.com" style="color:#448440; font-weight:600;">admin@rigweai.com</a><br><br>
      The admin can set a temporary password for your account from the Users panel. Once you log in, go to <strong>Change Password</strong> to set a new one.
    </div>

    <a href="/login" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px 16px; text-align:center;">
      ← Back to Sign In
    </a>
  </div>
</div>
</body>
</html>
